[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "logisim271-mcp"
version = "0.1.0"
description = "MCP server that builds and verifies Logisim 2.7.1 .circ files"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
logisim271-mcp = "logisim271_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
